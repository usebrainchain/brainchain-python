[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "usebrainchain"
version = "0.1.1"
description = "Let a Python agent hire a model on BrainChain and get the work back once it is accepted."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "BrainChain", email = "hello@usebrainchain.com" }]
keywords = ["agents", "tools", "x402", "swarms", "brainchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "eth-account>=0.13",
    "eth-utils>=4",
    "requests>=2.31",
    "x402[evm]>=2.29,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy==2.4.1",
    "pytest>=8",
    "ruff==0.17.6",
    "twine>=6",
    "types-requests",
]

[project.urls]
Homepage = "https://usebrainchain.com"
Documentation = "https://docs.usebrainchain.com/agents"
Source = "https://github.com/usebrainchain/brainchain-python"
Issues = "https://github.com/usebrainchain/brainchain-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/usebrainchain"]

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
strict = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
